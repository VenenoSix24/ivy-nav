<!doctype html>
<!--
  分享卡片的版式。由 scripts/brand/generate-assets.mjs 用无头 Chrome 渲染成
  src/app/opengraph-image.png（1200×630）。改这里就改了分享预览。
  只画固定内容、不用网络字体：OG 图是一次性产物，等宽等高的系统字体最稳。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue",
          Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        position: relative;
      }
      /* 与首页同一套环境光：两团模糊色斑 */
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .glow-a {
        width: 520px;
        height: 520px;
        left: -150px;
        top: -190px;
        background: #8fd0bb;
        opacity: 0.5;
      }
      .glow-b {
        width: 560px;
        height: 560px;
        right: -170px;
        bottom: -230px;
        background: #bcdcc8;
        opacity: 0.55;
      }
      .frame {
        position: relative;
        height: 100%;
        padding: 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .leaf {
        width: 116px;
        height: 116px;
        margin-bottom: 44px;
      }
      .name {
        font-size: 78px;
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 1.04;
      }
      .name .zh {
        color: #6e6e73;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .slogan {
        margin-top: 26px;
        font-size: 31px;
        font-weight: 400;
        color: #6e6e73;
        letter-spacing: -0.01em;
      }
      .foot {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 74px;
        padding-top: 26px;
        border-top: 1px solid rgba(0, 0, 0, 0.09);
        font-size: 21px;
        color: #86868b;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="frame">
      <img class="leaf" src="source/yiye.png" alt="" />
      <div class="name">Ivy <span class="zh">· 一叶</span></div>
      <div class="slogan">One page. Many places.</div>
    </div>
    <div class="foot">个人专属的网站、项目与常用工具入口</div>
  </body>
</html>
